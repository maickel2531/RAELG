{% extends 'base.html' %}
{% load static %}
{% block content %}
<h2>Crear Nueva Remisión</h2>

<form method="post">
  {% csrf_token %}
  
  <div class="mb-3">
    <label class="form-label">Cliente *</label>
    <select name="cliente" class="form-control" required>
      <option value="">-- Seleccione un cliente --</option>
      {% for c in clientes %}
        <option value="{{ c.id }}">
          {{ c.primer_nombre_cliente }} {{ c.primer_apellido_cliente }} ({{ c.documento_id }})
        </option>
      {% endfor %}
    </select>
  </div>

  <div class="mb-3">
    <label class="form-label">Fecha de entrega estimada</label>
    <input type="date" name="fecha_entrega_estimada" class="form-control">
  </div>

  <div class="mb-3">
    <label class="form-label">Observaciones</label>
    <textarea name="observaciones" class="form-control" rows="3"></textarea>
  </div>

  <h4>Productos en la remisión</h4>
  <div id="productos-container">
    <div class="producto-item mb-2">
      <select name="producto_id" class="form-control d-inline" style="width: 60%;" required>
        <option value="">-- Producto --</option>
        {% for p in productos %}
          <option value="{{ p.id }}">{{ p.nombre_producto }} (${{ p.precio_venta }})</option>
        {% endfor %}
      </select>
      <input type="number" name="cantidad" class="form-control d-inline" style="width: 30%;" placeholder="Cantidad" min="1" required>
    </div>
  </div>

  <button type="button" class="btn btn-sm btn-outline-secondary" onclick="agregarProducto()">
    + Agregar otro producto
  </button>

  <div class="mt-4">
    <button type="submit" class="btn btn-primary">Crear Remisión</button>
    <a href="{% url 'lista_remisiones' %}" class="btn btn-secondary">Cancelar</a>
  </div>
</form>

<script>
function agregarProducto() {
  const container = document.getElementById('productos-container');
  const newItem = document.createElement('div');
  newItem.className = 'producto-item mb-2';
  newItem.innerHTML = `
    <select name="producto_id" class="form-control d-inline" style="width: 60%;" required>
      <option value="">-- Producto --</option>
      {% for p in productos %}
        <option value="{{ p.id }}">{{ p.nombre_producto }} (${{ p.precio_venta }})</option>
      {% endfor %}
    </select>
    <input type="number" name="cantidad" class="form-control d-inline" style="width: 30%;" placeholder="Cantidad" min="1" required>
  `;
  container.appendChild(newItem);
}
</script>
{% endblock %}
