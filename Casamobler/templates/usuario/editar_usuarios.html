{% extends 'base.html' %}
{% block content %}
              <h4 class="fw-bold py-3 mb-4"><span class="text-muted fw-light">Configuracion de Usuario /</span> Editar Usuario</h4>

              <div class="row">
                <div class="col-md-12">
                  <ul class="nav nav-pills flex-column flex-md-row mb-3">
                    <li class="nav-item">
                      <a class="nav-link active" href="javascript:void(0);"><i class="bx bx-user me-1"></i> Usuario</a>
                    </li>
                  </ul>
                  <div class="card mb-4">
                    <h5 class="card-header">Datos de Usuario</h5>
                    <hr class="my-0" />
                    <div class="card-body">
                      <form  method="POST" action="{% url 'editar_usuarios' usuario.id %}">
                        {% csrf_token %}
                        {% if error %}<p style="color:red;">{{ error }}</p>{% endif %}
                        <div class="row">
                          <div class="mb-3 col-md-6">
                            <label for="primer_nombre_usuario" class="form-label">Primer Nombre</label>
                            <input class="form-control"  value = "{{ usuario.primer_nombre_usuario }}" type="text" name="primer_nombre_usuario"  required/>
                          </div>
                          <div class="mb-3 col-md-6">
                            <label for="segundo_nombre_usuario" class="form-label">Segundo Nombre</label>
                            <input class="form-control"  value = "{{ usuario.segundo_nombre_usuario }}" type="text" name="segundo_nombre_usuario"   />
                          </div>
                          <div class="mb-3 col-md-6">  
                            <label for="primer_apellido_usuario" class="form-label">Primer Apellido</label>
                            <input class="form-control"  value="{{ usuario.primer_apellido_usuario }}" type="text" name="primer_apellido_usuario"    required/>
                          </div>
                          <div class="mb-3 col-md-6">
                            <label for="segundo_apellido_usuario" class="form-label">Segundo Apellido</label>
                            <input class="form-control"  value="{{ usuario.segundo_apellido_usuario }}" type="text" name="segundo_apellido_usuario"   required/>
                          </div>
                          <div class="mb-3 col-md-6">
                            <label for="correo" class="form-label">Correo</label>
                            <input class="form-control"  value="{{ usuario.correo }}" type="text" name="correo"  required/>
                          </div>
                          <div class="mb-3 col-md-6">   
                            <label for="telefono" class="form-label">Telefono</label>
                            <input class="form-control"  value = "{{ usuario.telefono }}" type="number" name="telefono"   required/>
                          </div>
                        </div>
                        <div class="mt-2">
                          <button type="submit" class="btn btn-primary me-2">Editar Usuario</button>
                          
                          <button type="reset" class="btn btn-outline-secondary">Cancelar</button>
                        </div>
                      </form>
                    </div>
                    <!-- /Account -->
                  </div>
                </div>
              </div>
            </div>
{% endblock %}
