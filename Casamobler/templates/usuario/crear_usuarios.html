{% extends 'base.html' %}
{% load static %}
{% block content %}
<div class="form-center-container">
    <div class="card custom-card">
        <div class="card-header custom-card-header text-center">
            <h4 class="mb-0">Crear Usuario</h4>
        </div>
        <div class="card-body">
            <form method="POST" action="{% url 'crear_usuarios' %}">
                {% csrf_token %}
                <div class="row">
                    <div class="col-md-6">

                        <div class="mb-3">
                            <label for="p_nombre" class="form-label">Primer nombre</label>
                            <input type="text" class="form-control" id="p_nombre" name="p_nombre" placeholder="Ingrese el primer nombre" required>
                        </div>

                        <div class="mb-3">
                            <label for="s_nombre" class="form-label">Segundo nombre</label>
                            <input type="text" class="form-control" id="s_nombre" name="s_nombre" placeholder="Ingrese el segundo nombre">
                        </div>

                        <div class="mb-3">
                            <label for="p_apellido" class="form-label">Primer apellido</label>
                            <input type="text" class="form-control" id="p_apellido" name="p_apellido" placeholder="Ingrese el primer apellido" required>
                        </div>

                        <div class="mb-3">
                            <label for="s_apellido" class="form-label">Segundo apellido</label>
                            <input type="text" class="form-control" id="s_apellido" name="s_apellido" placeholder="Ingrese el segundo apellido">
                        </div>

                    </div>
                    <div class="col-md-6">

                        <div class="mb-3">
                            <label for="email" class="form-label">Correo electrónico</label>
                            <input type="email" class="form-control" id="email" name="email" placeholder="usuario@correo.com" required>
                        </div>

                        <div class="mb-3">  
                            <label for="telefono" class="form-label">Telefono</label>
                            <input type="text" class="form-control" id="telefono" name="telefono" placeholder="Ingrese el telefono">
                        </div>

                        <div class="mb-3"> 
                            <label for="rol" class="form-label">Rol</label>
                            <select id="rol" name="rol" class="form-select" required>
                                <option value="">Seleccione un rol</option>
                                {% for rol in roles %}
                                <option value="{{ rol.id }}">{{ rol.nombre_rol }}</option>
                                {% endfor %} 
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Contraseña</label>
                            <input type="password" class="form-control" id="password" name="contraseña" placeholder="Ingrese una contraseña" required>
                        </div>
                    </div>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-custom btn-lg rounded-pill shadow-sm">
                        <i class="bi bi-person-plus-fill"></i> Crear Usuario
                    </button>
                </div>
            </form>
        </div>
        <div class="card-footer custom-card-footer text-center text-muted small">
            Todos los campos son obligatorios
        </div>
    </div>
</div>
{% endblock %}
