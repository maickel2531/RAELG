{% load static %}

<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link rel="apple-touch-icon" sizes="76x76" href="{% static 'assets/img/apple-icon.png' %}">
  <link rel="icon" type="image/jpg" href="{% static 'assets/img/fondoi.jpg' %}">
  <title>Registrarse</title>
  <link rel="canonical" href="https://app-generator.dev/product/soft-ui-dashboard/django/">
  <link href="https://fonts.googleapis.com/css?family=Inter:300,400,500,600,700,800" rel="stylesheet">
  <link href="https://demos.creative-tim.com/argon-dashboard-pro/assets/css/nucleo-icons.css" rel="stylesheet">
  <link href="https://demos.creative-tim.com/argon-dashboard-pro/assets/css/nucleo-svg.css" rel="stylesheet">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.0/js/all.min.js" crossorigin="anonymous"></script>
  <link id="pagestyle" href="{% static 'assets/css/soft-ui-dashboard.css' %}?v=1.1.0" rel="stylesheet">
</head>
<body>
  <div class="container position-sticky z-index-sticky top-0">
    <div class="row">
      <div class="col-12">
        <!-- Navbar -->
        <nav class="navbar navbar-expand-lg blur blur-rounded top-0 z-index-3 shadow position-absolute my-3 py-2 start-0 end-0 mx-4">
          <div class="container-fluid pe-0">
            <a class="navbar-brand font-weight-bolder ms-lg-0 ms-3 " href="/">
              Bienvenidos a Casa Mobler 
            </a>
            <button class="navbar-toggler shadow-none ms-2" type="button" data-bs-toggle="collapse" data-bs-target="#navigation" aria-controls="navigation" aria-expanded="false" aria-label="Toggle navigation">
              <span class="navbar-toggler-icon mt-2">
                <span class="navbar-toggler-bar bar1"></span>
                <span class="navbar-toggler-bar bar2"></span>
                <span class="navbar-toggler-bar bar3"></span>
              </span>
            </button>
            <div class="collapse navbar-collapse" id="navigation">
              <ul class="navbar-nav mx-auto ms-xl-auto me-xl-7">
                <li class="nav-item">
                  <a class="nav-link me-2" href="{% url 'login' %}">
                    <i class="fas fa-user-circle opacity-6 text-dark me-1"></i>
                    Iniciar Sesion
                  </a>
                </li>
                <li class="nav-item">
                  <a class="nav-link me-2 active" href="{% url 'register' %}">
                    <i class="fas fa-key opacity-6 text-dark me-1"></i>
                    Registrate
                  </a>
                </li>
              </ul>
            </div>
          </div>
        </nav>
        <!-- End Navbar -->
      </div>
    </div>
  </div>

  <main class="main-content mt-0 ps">
    <section>
      <div class="page-header min-vh-75">
        <div class="container">
          <div class="row">
            <div class="col-xl-4 col-lg-5 col-md-6 d-flex flex-column mx-auto">
              <div class="card card-plain mt-8">
                <div class="card-header pb-0 text-left bg-transparent">
                  <h3 class="font-weight-bolder text-info text-gradient">Registrarse</h3>
                  <p class="mb-0">Crea tu cuenta para acceder a Casa Mobler</p>
                </div>
                <div class="card-body">
                  <form class="mb-3" action="{% url 'register' %}" method="POST">
                    {% csrf_token %}
                    {% if error %}<p style="color:red;">{{ error }}</p>{% endif %}
                    <label>Usuario</label>
                    <div class="mb-3">
                      <input type="text" name="username" class="form-control" placeholder="Usuario" required>
                    </div>
                    <label>Email</label>
                    <div class="mb-3">
                      <input type="email" name="email" class="form-control" placeholder="Email" required>
                    </div>
                    <label>Contraseña</label>
                    <div class="mb-3">
                      <input type="password" name="password" class="form-control" placeholder="Contraseña" required>
                    </div>
                    <label>Rol</label>
                    <div class="mb-3">
                      <select class="form-select" name="rol" required>
                        <option value="" selected disabled>Seleccione un rol</option>
                        {% for rol in roles %}
                        <option value="{{ rol.id }}">{{ rol.nombre_rol }}</option>
                        {% endfor %}
                      </select>
                    </div>
                    <div class="text-center">
                      <button type="submit" class="btn bg-gradient-info w-100 mt-4 mb-0">Registrarse</button>
                    </div>
                  </form>
                </div>
                <div class="card-footer text-center pt-0 px-lg-2 px-1">
                  <p class="mb-4 text-sm mx-auto">
                    ¿Ya tienes una cuenta?
                    <a href="{% url 'login' %}" class="text-info text-gradient font-weight-bold">Iniciar sesión</a>
                  </p>
                </div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="oblique position-absolute top-0 h-100 d-md-block d-none me-n8">
                <div class="oblique-image bg-cover position-absolute fixed-top ms-auto h-100 z-index-0 ms-n6" style="background-image:url('{% static 'assets/img/Image_20240826_104324_853.jpeg' %}')"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer py-5">
    <div class="container">
      <!-- ...igual al login... -->
    </div>
  </footer>

  <script src="{% static 'assets/js/core/popper.min.js' %}"></script>
  <script src="{% static 'assets/js/core/bootstrap.min.js' %}"></script>
  <script src="{% static 'assets/js/plugins/perfect-scrollbar.min.js' %}"></script>
  <script src="{% static 'assets/js/plugins/smooth-scrollbar.min.js' %}"></script>
  <script src="{% static 'assets/js/soft-ui-dashboard.min.js' %}?v=1.1.0"></script>
</body>
</html>
