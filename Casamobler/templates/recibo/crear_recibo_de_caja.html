{% extends 'base.html' %}
{% load static %}
{% block content %}
<div class="form-container">
    <div class="form-header">
        Crear Recibo de Caja
    </div>
    <form method="POST" action="{% url 'crear_recibo_de_caja' %}">
        {% csrf_token %}
        <div class="form-row">

            <div class="form-col">
                <label for="pedido" class="form-label">Pedido</label>
                <select class="form-input" id="pedido" name="descripcion_producto" required>
                    <option value="">Seleccione un pedido</option>
                    {% for pedido in pedidos %}
                    <option value="{{ pedido.id }}">{{ pedido.descripcion_producto }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-col">
                <label for="fecha_recibo" class="form-label">Fecha de Recibo</label>
                <input type="date" class="form-input" id="fecha_recibo" name="fecha_recibo" placeholder="Ingrese la fecha" required>
            </div>

        </div>

        <div class="form-row">

            <div class="form-col">
                <label for="valor_abonado" class="form-label">Valor de Abonado</label>
                <input type="number" class="form-input" id="valor_abonado" name="valor_abonado" placeholder="Ingrese el valor de abonado" required>
            </div>

            <div class="form-col">
                <label for="forma_pago" class="form-label">Forma de Pago</label>
                <input type="text" class="form-input" id="forma_pago" name="forma_pago" placeholder="Ingrese la forma de pago" required>
            </div>

        </div>

        <div class="form-row">
            <div class="form-col">
                <label for="cliente_id" class="form-label">Nombre Cliente</label>
                <select class="form-input" id="cliente_id" name="cliente_id" required>
                    <option value="">Seleccione un cliente</option>
                    {% for cliente in clientes %}
                    <option value="{{ cliente.id }}">{{ cliente.p_nombrec }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="form-col">
                <label for="direccion" class="form-label">Dirección</label>
                <input type="text" class="form-input" id="direccion" name="direccion" placeholder="Ingrese la dirección" required>
            </div>
            
        </div>

        <div class="form-row">
            <div class="form-col">
                <label for="concepto" class="form-label">Concepto</label>
                <input type="text" class="form-input" id="concepto" name="concepto" placeholder="Ingrese el concepto" required>
            </div>
                 
        </div>

        <button type="submit" class="form-button">
            Crear Recibo de Caja
        </button>
        
    </form>

    <div class="text-center text-muted small" style="margin-top:10px;">
        Todos los campos son obligatorios
    </div>
</div>
{% endblock %}
