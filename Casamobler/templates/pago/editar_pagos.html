{% extends 'base.html' %}
{% block content %}
              <h4 class="fw-bold py-3 mb-4"><span class="text-muted fw-light">Configuracion de Pago /</span> Editar Pago</h4>

              <div class="row">
                <div class="col-md-12">
                  <ul class="nav nav-pills flex-column flex-md-row mb-3">
                    <li class="nav-item">
                      <a class="nav-link active" href="javascript:void(0);"><i class="bx bx-user me-1"></i> Pago</a>
                    </li>
                  </ul>
                  <div class="card mb-4">
                    <h5 class="card-header">Datos de Pago</h5>
                    <!-- Account -->
                    <hr class="my-0" />
                    <div class="card-body">
                      <form  method="POST" action="{% url 'editar_pagos' pago.id %}">
                        {% csrf_token %}
                        {% if error %}<p style="color:red;">{{ error }}</p>{% endif %}
                        <div class="row">
                          <div class="mb-3 col-md-6">
                            <label for="pedido" class="form-label">Pedido</label>
                            <select class="form-select" name="pedido" required>
                              <option value="{{ pago.pedido.id }}" selected>{{ pago.pedido.pedido }}</option>
                              {% for pedido in pedidos %}
                                <option value="{{ pedido.id }}">{{ pedido.pedido }}</option>
                              {% endfor %}
                            </select>
                          </div>

                          <div class="mb-3 col-md-6">
                            <label for="cliente" class="form-label">Cliente</label>
                            <select class="form-select" name="cliente" required>
                              <option value="{{ pago.cliente.id }}" selected>{{ pago.cliente.primer_nombre_cliente }}</option>
                              {% for cliente in clientes %}
                                <option value="{{ cliente.id }}">{{ cliente.primer_nombre_cliente }}</option>
                              {% endfor %}
                            </select>
                          </div>

                          <div class="mb-3 col-md-6">  
                            <label for="fecha_pago" class="form-label">Fecha de Pago</label>
                            <input class="form-control"  value = "{{ pago.fecha_pago }}" type="date" name="fecha_pago" placeholder="Ingrese la fecha" required>
                          </div>

                          <div class="mb-3 col-md-6">
                            <label for="monto_pago" class="form-label">Monto de Pago</label>
                            <input class="form-control"  value = "{{ pago.monto_pago }}" type="number" name="monto_pago"  required/>
                          </div>

                          <div class="mb-3 col-md-6">
                            <label for="observaciones" class="form-label">Observaciones</label>
                            <input class="form-control"  value = "{{ pago.observaciones }}" type="text" name="observaciones"  required/>
                          </div>

                        </div>

                        <div class="mt-2">
                          <button type="submit" class="btn btn-dark me-2">Editar Pago</button>
                          <button type="reset" class="btn btn-outline-secondary">Cancelar</button>
                        </div>
                      </form>
                    </div>
                    <!-- /Account -->
                  </div>
                </div>
              </div>
            </div>
{% endblock %}
