{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Iniciar Sesión | CASAMOBLER</title>

  <!-- Fuentes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800&family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="{% static 'assets/img/fondoi.jpg' %}" />
  <link rel="stylesheet" href="{% static 'assets/css/custom-login.css' %}">
</head>
<body>

  <div class="login-container">
    <!-- Decorative circles -->
    <div class="decoration circle circle-1"></div>
    <div class="decoration circle circle-2"></div>

    <!-- Decorative lines -->

    
    <!-- Logo -->
    <div class="logo-container">
      <img src="{% static 'assets/img/logoaa.jpeg' %}" alt="logo" style="width: 400px; height: 73px; object-fit: cover;"/>
      <div class="logo">CASAMOBLER</div>
      <p class="subtitle">Inicia sesión para acceder a tu cuenta</p>
    </div>

    <!-- Formulario de login -->
    <form method="post" action="{% url 'login' %}">
      {% csrf_token %}

      <div class="form-group">
        <label for="id_username">Usuario</label>
        <input id="id_username" type="text" name="username" placeholder="Ingresa tu nombre de usuario"  required autofocus>
        <span class="input-icon">👤</span>
      </div>

      <div class="form-group">
        <label for="id_password">Contraseña</label>
        <input id="id_password" type="password" name="password" placeholder="••••••••"  required>
        <span class="input-icon">🔒</span>
      </div>

      <button type="submit" class="btn-login">Iniciar Sesión</button>
    </form>

    <a href="{% url 'index' %}" class="back-home">← Volver al inicio</a>
  </div>

</body>
</html>
