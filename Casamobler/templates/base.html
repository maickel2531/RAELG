{% extends 'layoud/head.html' %}
{% load static %}

{% block base %}
<body>
  <!-- Layout wrapper -->
  <div class="layout-wrapper layout-content-navbar">
    <div class="layout-container">
      <!-- Sidebar -->
      {% include 'layoud/sidebar.html' %}
      <!-- / Sidebar -->

      <!-- Layout container -->
      <div class="layout-page">
        <!-- Navbar -->
        {% include 'layoud/nav.html' %}
        <!-- / Navbar -->

        <!-- Content wrapper -->
        <div class="content-wrapper">
          <!-- Main content -->
          <div class="container-xxl flex-grow-1 container-p-y py-4">
            {% block content %}
            {% endblock %}
          </div>
          <!-- / Main content -->

          <!-- Footer -->
          <footer class="content-footer footer bg-footer-theme border-top">
            <div class="container-xxl py-3">
              <div class="text-center text-muted">
                ©
                <script>document.write(new Date().getFullYear());</script>
                , Todos los derechos reservados.
                <a class="fw-bold text-body" href="https://www.instagram.com/casamobler/">Casamobler</a>
              </div>
            </div>
          </footer>
          <!-- / Footer -->

          <div class="content-backdrop fade"></div>
        </div>
        <!-- / Content wrapper -->
      </div>
      <!-- / Layout page -->
    </div>

    <!-- Overlay -->
    <div class="layout-overlay layout-menu-toggle"></div>
  </div>
  <!-- / Layout wrapper -->

  {% include 'layoud/footer.html' %}
</body>
{% endblock %}
