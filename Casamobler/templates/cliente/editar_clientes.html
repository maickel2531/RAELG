{% extends 'base.html' %}
{% block content %}
              <h4 class="fw-bold py-3 mb-4"><span class="text-muted fw-light">Configuracion de Cliente /</span> Editar Cliente</h4>

              <div class="row">
                <div class="col-md-12">
                  <ul class="nav nav-pills flex-column flex-md-row mb-3">
                    <li class="nav-item">
                      <a class="nav-link active" href="javascript:void(0);"><i class="bx bx-user me-1"></i> Cliente</a>
                    </li>
                  </ul>
                  <div class="card mb-4">
                    <h5 class="card-header">Datos de Cliente</h5>
                    <!-- Account -->
                    <hr class="my-0" />
                    <div class="card-body">
                      <form  method="POST" action="{% url 'editar_clientes' cliente.id %}">
                        {% csrf_token %}
                        {% if error %}<p style="color:red;">{{ error }}</p>{% endif %}
                        <div class="row">
                          <div class="mb-3 col-md-6">
                            <label for="primer_nombre_cliente" class="form-label">Primer Nombre</label>
                            <input class="form-control" value="{{ cliente.primer_nombre_cliente }}" type="text" name="primer_nombre_cliente"  required/>
                          </div>
                          <div class="mb-3 col-md-6">
                            <label for="segundo_nombre_cliente" class="form-label">Segundo Nombre</label>
                            <input class="form-control"  value="{{ cliente.segundo_nombre_cliente }}" type="text" name="segundo_nombre_cliente" />
                          </div>
                          <div class="mb-3 col-md-6">
                            <label for="primer_apellido_cliente" class="form-label">Primer Apellido</label>
                            <input class="form-control"  value = "{{ cliente.primer_apellido_cliente }}" type="text" name="primer_apellido_cliente"  required/>
                          </div>
                          <div class="mb-3 col-md-6">
                            <label for="segundo_apellido_cliente" class="form-label">Segundo Apellido</label>
                            <input class="form-control"  value="{{ cliente.segundo_apellido_cliente }}" type="text" name="segundo_apellido_cliente" />
                          </div>
                          <div class="mb-3 col-md-6">
                            <label for="correo_electronico" class="form-label">Correo Electrónico</label>
                            <input class="form-control"  value = "{{ cliente.correo_electronico }}" type="email" name="correo_electronico" required/>
                          </div>
                          <div class="mb-3 col-md-6">   
                            <label for="direccion" class="form-label">Dirección</label>
                            <input class="form-control"value = "{{ cliente.direccion }}" type="text" name="direccion" required/>
                          </div>
                          <div class="mb-3 col-md-6">
                            <label for="telefono" class="form-label">Teléfono</label>
                            <input class="form-control" type="text" value = "{{ cliente.telefono }}" name="telefono" pattern="\d{10}" title="El teléfono debe tener exactamente 10 dígitos." required/>
                            <div class="form-text">
                              <p>El teléfono debe tener exactamente 10 dígitos.</p>
                            </div>
                          </div>
                          <div class="mb-3 col-md-6">
                            <label for="documento_id" class="form-label">Documento ID</label>
                            <input class="form-control" type="text"value = "{{ cliente.documento_id }}" name="documento_id" pattern="\d{11}" title="El documento ID debe tener exactamente 11 dígitos." required/>
                            <div class="form-text">
                              <p>El documento ID debe tener exactamente 11 dígitos.</p>
                          </div>
                        </div>
                        <div class="mt-2">
                          <button type="submit" class="btn btn-primary me-2">Editar Cliente</button>
                          <button type="reset" class="btn btn-outline-secondary">Cancelar</button>
                        </div>
                      </form>
                    </div>
                    <!-- /Account -->
                  </div>
                </div>
              </div>
            </div>
{% endblock %}
