{% load static %}
{% block nav %}
<!-- Navbar -->
<nav class="layout-navbar container-xxl navbar navbar-expand-xl navbar-detached align-items-center bg-navbar-theme" id="layout-navbar">
  <div class="layout-menu-toggle navbar-nav align-items-xl-center me-3 me-xl-0 d-xl-none">
    <a class="nav-item nav-link px-0 me-xl-4" href="javascript:void(0)">
      <i class="bx bx-menu bx-sm text-body"></i>
    </a>
  </div>

  <div class="navbar-nav-right d-flex align-items-center" id="navbar-collapse">
    <!-- Search -->
    <div class="navbar-nav align-items-center me-3">
      <div class="nav-item d-flex align-items-center">
        <i class="bx bx-search bx-sm text-muted me-2"></i>
        <input
          type="text"
          class="form-control navbar-search border-0 shadow-none bg-transparent text-body"
          placeholder="Buscar..."
          aria-label="Buscar..."
        />
      </div>
    </div>
    <!-- /Search -->

    <ul class="navbar-nav flex-row align-items-center ms-auto">
      <!-- User Dropdown -->
      <li class="nav-item navbar-dropdown dropdown-user dropdown">
        <a class="nav-link dropdown-toggle hide-arrow p-0" href="javascript:void(0);" data-bs-toggle="dropdown">
          <div class="avatar avatar-online">
            <img src="{% static 'assets/img/avatars/1.png' %}" alt="Avatar" class="w-px-40 h-auto rounded-circle border border-2 border-red-accent">
          </div>
        </a>
        <ul class="dropdown-menu dropdown-menu-end py-0">
          <!-- Header -->
          <li>
            <div class="dropdown-header d-flex align-items-center px-4 py-3 bg-dark text-white">
              <div class="avatar avatar-online me-3">
                <img src="{% static 'assets/img/avatars/1.png' %}" alt="Avatar" class="w-px-40 h-auto rounded-circle">
              </div>
              <div>
                <h6 class="mb-0 fw-bold">{{ request.user.username }}</h6>
                <small class="text-muted">
                  {% if request.user.perfil.rol %}
                    {{ request.user.perfil.rol.nombre_rol }}
                  {% else %}
                    Sin rol
                  {% endif %}
                </small>
              </div>
            </div>
          </li>
          <li><hr class="dropdown-divider my-1"></li>
          <!-- Opciones -->
          <li>
            <a class="dropdown-item d-flex align-items-center px-4 py-2" href="#">
              <i class="bx bx-user me-2 text-muted"></i>
              <span>Mi Perfil</span>
            </a>
          </li>
          <li>
            <a class="dropdown-item d-flex align-items-center px-4 py-2" href="{% url 'logout' %}" onclick="return confirm('¿Estás seguro de que deseas cerrar sesión?');">
              <i class="bx bx-power-off me-2 text-danger"></i>
              <span>Cerrar Sesión</span>
            </a>
          </li>
        </ul>
      </li>
      <!-- /User -->
    </ul>
  </div>
</nav>
{% endblock %}
